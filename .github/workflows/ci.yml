name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Volatility 3
        run: |
          python3 -m venv .venv
          .venv/bin/pip install volatility3==2.28.2
          echo "DFA_VOL_BIN=$PWD/.venv/bin/vol" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Doctor
        run: node dist/main.js doctor
      - name: Package contents
        run: npm pack --dry-run
